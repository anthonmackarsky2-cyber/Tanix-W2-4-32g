name: Ultimate Linux XFCE Build

on:
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-24.04

    steps:
    - name: Install Base Host Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git rsync kmod debianutils ccache device-tree-compiler gcc-aarch64-linux-gnu binfmt-support qemu-user-static parted e2fsprogs wget

    - name: Clone CoreELEC Linux Kernel
      run: |
        git clone --depth=1 -b amlogic-5.4.210 $(echo "aHR0cHM6Ly9naXRodWIuY29tL0NvcmVFTEVDL2xpbnV4LWFtbG9naWM=" | base64 --decode) kernel

    - name: Configure and Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Генерация базовой конфигурации
        make g12a_defconfig || make amlogic_defconfig || make defconfig
        
        # === НАСТРОЙКА ВСЕХ ДРАЙВЕРОВ ДЛЯ TANIX W2 ===
        ./scripts/config --enable CONFIG_USB_XHCI_HCD
        ./scripts/config --enable CONFIG_USB_XHCI_PLATFORM
        ./scripts/config --enable CONFIG_USB_EHCI_HCD
        ./scripts/config --enable CONFIG_USB_EHCI_HCD_PLATFORM
        ./scripts/config --enable CONFIG_USB_AMLOGIC_PHY
        ./scripts/config --enable CONFIG_AMLOGIC_USB
        ./scripts/config --enable CONFIG_DRM
        ./scripts/config --enable CONFIG_DRM_AMLOGIC
        ./scripts/config --enable CONFIG_DRM_AMLOGIC_MESON_VPU
        ./scripts/config --enable CONFIG_DRM_AMLOGIC_HDMITX
        ./scripts/config --enable CONFIG_MALI_MIDGARD
        ./scripts/config --enable CONFIG_MALI_BIFROST
        ./scripts/config --enable CONFIG_SND_MESON_AXG_SOUND_CARD
        ./scripts/config --enable CONFIG_SND_MESON_CODEC_S4
        ./scripts/config --enable CONFIG_NETDEVICES
        ./scripts/config --enable CONFIG_ETHERNET
        ./scripts/config --enable CONFIG_STMMAC_ETH
        ./scripts/config --enable CONFIG_STMMAC_PLATFORM
        ./scripts/config --enable CONFIG_WLAN
        ./scripts/config --enable CONFIG_BRCMFMAC
        ./scripts/config --enable CONFIG_RTL8XXXU
        ./scripts/config --enable CONFIG_MMC
        ./scripts/config --enable CONFIG_MMC_MESON_GX
        ./scripts/config --enable CONFIG_EXFAT_FS
        ./scripts/config --enable CONFIG_NTFS_FS
        ./scripts/config --enable CONFIG_EXT4_FS
        ./scripts/config --enable CONFIG_ARM_AMLOGIC_CPUFREQ
        ./scripts/config --enable CONFIG_AMLOGIC_RESET
        ./scripts/config --enable CONFIG_RTC_DRV_MESON_VRTC
        
        ./scripts/config --disable DEBUG_INFO
        
        # Фиксируем конфигурацию по умолчанию
        make olddefconfig
        
        # Компиляция с полным подавлением ошибок варнингов современным GCC
        make -j$(nproc) KCFLAGS="-w -fpermissive" WERROR=0 Image modules amlogic/s4_s905w2_4g.dtb
        
        # Сборка и установка модулей
        mkdir -p ../modules_install
        make modules_install INSTALL_MOD_PATH=../modules_install WERROR=0 KCFLAGS="-w"

    - name: Download Pure Ubuntu XFCE RootFS
      run: |
        mkdir rootfs
        B64_OS="aHR0cHM6Ly9jZGltYWdlLnVidW50dS5jb20vdWJ1bnR1LWJhc2UvcmVsZWFzZXMvMjQuMDQvcmVsZWFzZS91YnVudHUtYmFzZS0yNC4wNC1iYXNlLWFybTY0LnRhci5neg=="
        REAL_OS=$(echo "$B64_OS" | base64 --decode)
        wget -qO- "$REAL_OS" | tar -xzC rootfs/

    - name: Create Flashable System Image
      run: |
        dd if=/dev/zero of=tanix_w2_xfce.img bs=1M count=3000
        sudo parted -s tanix_w2_xfce.img mklabel msdos
        sudo parted -s tanix_w2_xfce.img mkpart primary ext4 4MiB 100%
        sudo losetup -Pf tanix_w2_xfce.img
        LOOP_DEV=$(losetup -j tanix_w2_xfce.img | cut -d: -f1)
        PART_DEV="${LOOP_DEV}p1"
        sudo mkfs.ext4 -F -L "ROOTFS" $PART_DEV
        mkdir -p mnt
        sudo mount $PART_DEV mnt
        sudo cp -a rootfs/* mnt/
        sudo mkdir -p mnt/boot/amlogic
        sudo cp kernel/arch/arm64/boot/Image mnt/boot/
        sudo cp kernel/arch/arm64/boot/dts/amlogic/s4_s905w2_4g.dtb mnt/boot/amlogic/
        sudo cp -a modules_install/lib/modules/* mnt/lib/modules/
        sudo cp /usr/bin/qemu-aarch64-static mnt/usr/bin/
        sudo chroot mnt /bin/bash -c "apt-get update && apt-get install -y xfce4 xfce4-goodies xorg lightdm network-manager sudo --no-install-recommends && useradd -m -s /bin/bash linuxuser && echo 'linuxuser:tanix' | chpasswd && usermod -aG sudo linuxuser"
        sudo rm mnt/usr/bin/qemu-aarch64-static
        sudo umount mnt
        sudo losetup -d $LOOP_DEV

    - name: Upload Final Image
      uses: actions/upload-artifact@v4
      with:
        name: Tanix-W2-Ubuntu-XFCE-Image
        path: tanix_w2_xfce.img
