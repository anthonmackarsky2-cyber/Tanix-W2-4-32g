name: Build Linux XFCE from CoreELEC Source

on:
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-24.04

    steps:
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git rsync kmod debianutils ccache device-tree-compiler gcc-aarch64-linux-gnu binfmt-support qemu-user-static parted e2fsprogs systemd-container

        - name: Clone CoreELEC Linux Kernel
        run: git clone --depth=1 -b amlogic-5.4.210 $(echo "aHR0cHM6Ly9naXRodWIuY29tL0NvcmVFTEVDL2xpbnV4LWFtbG9naWM=" | base64 --decode) kernel


        - name: Configure and Compile Kernel
        run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make g12a_defconfig || make amlogic_defconfig || make defconfig
        ./scripts/config --disable DEBUG_INFO
        ./scripts/config --disable DEBUG_INFO_DWARF4
        ./scripts/config --disable DEBUG_INFO_DWARF5
        make -j$(nproc) Image modules amlogic/s4_s905w2_4g.dtb
        mkdir -p ../modules_install
        make modules_install INSTALL_MOD_PATH=../modules_install


        - name: Download Pure Ubuntu XFCE RootFS
        run: mkdir rootfs && wget -qO- $(echo "aHR0cHM6Ly9jZGltYWdlLnVidW50dS5jb20vdWJ1bnR1LWJhc2UvcmVsZWFzZXMvMjQuMDQvcmVsZWFzZS91YnVudHUtYmFzZS0yNC4wNC1iYXNlLWFybTY0LnRhci5neg==" | base64 --decode) | tar -xzC rootfs/


    - name: Create Flashable System Image
      run: |
        dd if=/dev/zero of=tanix_w2_xfce.img bs=1M count=3000
        sudo parted -s tanix_w2_xfce.img mklabel msdos
        sudo parted -s tanix_w2_xfce.img mkpart primary ext4 4MiB 100%
        sudo losetup -Pf tanix_w2_xfce.img
        LOOP_DEV=$(losetup -j tanix_w2_xfce.img | cut -d: -f1)
        PART_DEV="${LOOP_DEV}p1"
        sudo mkfs.ext4 -F -L "ROOTFS" $PART_DEV
        mkdir -p mnt
        sudo mount $PART_DEV mnt
        sudo cp -a rootfs/* mnt/
        sudo mkdir -p mnt/boot/amlogic
        sudo cp kernel/arch/arm64/boot/Image mnt/boot/
        sudo cp kernel/arch/arm64/boot/dts/amlogic/s4_s905w2_4g.dtb mnt/boot/amlogic/
        sudo cp -a modules_install/lib/modules/* mnt/lib/modules/
        sudo cp /usr/bin/qemu-aarch64-static mnt/usr/bin/
        sudo chroot mnt /bin/bash -c "apt-get update && apt-get install -y xfce4 xfce4-goodies xorg lightdm network-manager sudo --no-install-recommends && useradd -m -s /bin/bash linuxuser && echo 'linuxuser:tanix' | chpasswd && usermod -aG sudo linuxuser"
        sudo rm mnt/usr/bin/qemu-aarch64-static
        sudo umount mnt
        sudo losetup -d $LOOP_DEV

    - name: Upload Final Image
      uses: actions/upload-artifact@v4
      with:
        name: Tanix-W2-Ubuntu-XFCE-Image
        path: tanix_w2_xfce.img
