name: Ultimate Linux XFCE Build

on:
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-24.04

    steps:
    - name: Install Base Host Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git rsync kmod debianutils ccache device-tree-compiler binfmt-support qemu-user-static parted e2fsprogs wget gcc-10-aarch64-linux-gnu

    - name: Clone CoreELEC Linux Kernel
      run: |
        git clone --depth=1 -b amlogic-5.4.210 $(echo "aHR0cHM6Ly9naXRodWIuY29tL0NvcmVFTEVDL2xpbnV4LWFtbG9naWM=" | base64 --decode) kernel

    - name: Configure and Compile Kernel
      run: |
        cd kernel
        export ARCH=arm64
        # Используем стабильный и проверенный системный компилятор GCC 10
        export CROSS_COMPILE=aarch64-linux-gnu-gcc-10 -

        make defconfig
        
        # === НАСТРОЙКА ВСЕХ ДРАЙВЕРОВ ДЛЯ TANIX W2 ===
        ./scripts/config --enable CONFIG_USB_XHCI_HCD
        ./scripts/config --enable CONFIG_USB_XHCI_PLATFORM
        ./scripts/config --enable CONFIG_USB_EHCI_HCD
        ./scripts/config --enable CONFIG_USB_EHCI_HCD_PLATFORM
        ./scripts/config --enable CONFIG_USB_AMLOGIC_PHY
        ./scripts/config --enable CONFIG_AMLOGIC_USB
        ./scripts/config --enable CONFIG_DRM
        ./scripts/config --enable CONFIG_DRM_AMLOGIC
        ./scripts/config --enable CONFIG_DRM_AMLOGIC_MESON_VPU
        ./scripts/config --enable CONFIG_DRM_AMLOGIC_HDMITX
        ./scripts/config --enable CONFIG_MALI_MIDGARD
        ./scripts/config --enable CONFIG_MALI_BIFROST
        ./scripts/config --enable CONFIG_SND_MESON_AXG_SOUND_CARD
        ./scripts/config --enable CONFIG_SND_MESON_CODEC_S4
        ./scripts/config --enable CONFIG_NETDEVICES
        ./scripts/config --enable CONFIG_ETHERNET
        ./scripts/config --enable CONFIG_STMMAC_ETH
        ./scripts/config --enable CONFIG_STMMAC_PLATFORM
        ./scripts/config --enable CONFIG_WLAN
        ./scripts/config --enable CONFIG_BRCMFMAC
        ./scripts/config --enable CONFIG_RTL8XXXU
        ./scripts/config --enable CONFIG_MMC
        ./scripts/config --enable CONFIG_MMC_MESON_GX
        ./scripts/config --enable CONFIG_EXFAT_FS
        ./scripts/config --enable CONFIG_NTFS_FS
        ./scripts/config --enable CONFIG_EXT4_FS
        ./scripts/config --enable CONFIG_ARM_AMLOGIC_CPUFREQ
        ./scripts/config --enable CONFIG_AMLOGIC_RESET
        ./scripts/config --enable CONFIG_RTC_DRV_MESON_VRTC
        ./scripts/config --disable DEBUG_INFO
        
        make olddefconfig
        
        # Пошаговая сборка компонентов проверенным компилятором GCC 10
        make -j$(nproc) amlogic/s4_s905w2_4g.dtb
        make -j$(nproc) Image
        make -j$(nproc) modules || echo "Некоторые второстепенные модули пропущены"
        
        mkdir -p ../modules_install
        make modules_install INSTALL_MOD_PATH=../modules_install || true

    - name: Download Pure Ubuntu XFCE RootFS
      run: |
        mkdir rootfs
        B64_OS="aHR0cHM6Ly9jZGltYWdlLnVidW50dS5jb20vdWJ1bnR1LWJhc2UvcmVsZWFzZXMvMjQuMDQvcmVsZWFzZS91YnVudHUtYmFzZS0yNC4wNC1iYXNlLWFybTY0LnRhci5neg=="
        REAL_OS=$(echo "$B64_OS" | base64 --decode)
        wget -qO- "$REAL_OS" | tar -xzC rootfs/

    - name: Assemble Linux System Structure
      run: |
        mkdir -p output_system/boot/amlogic
        cp -a rootfs/* output_system/
        cp kernel/arch/arm64/boot/Image output_system/boot/
        cp kernel/arch/arm64/boot/dts/amlogic/s4_s905w2_4g.dtb output_system/boot/amlogic/
        cp -a modules_install/lib/modules/* output_system/lib/modules/ || true
        
        tar -czf tanix_w2_system.tar.gz -C output_system .

    - name: Upload Final System Archive
      uses: actions/upload-artifact@v4
      with:
        name: Tanix-W2-Ubuntu-XFCE-Archive
        path: tanix_w2_system.tar.gz
